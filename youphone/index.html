<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouPhone S.A — Acesso</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green:  #007a3d;
      --green2: #005a2d;
      --gold:   #f5c400;
      --dark:   #0e1a12;
      --dark2:  #162019;
      --text:   #e8f0ea;
      --text2:  #8aab93;
      --border: rgba(255,255,255,0.08);
      --glass:  rgba(255,255,255,0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Fundo animado ── */
    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 10% 20%, rgba(0,122,61,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 80%, rgba(245,196,0,0.08) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(0,90,45,0.12) 0%, transparent 60%);
    }

    /* Grade de pontos subtil */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Linha decorativa no topo */
    .top-stripe {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--green), var(--gold), var(--green));
      z-index: 10;
    }

    /* ── Card de login ── */
    .login-wrap {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-card {
      background: rgba(22, 32, 25, 0.85);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px 36px;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(0,122,61,0.1),
        0 24px 60px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }

    /* ── Cabeçalho ── */
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--green), var(--green2));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(0,122,61,0.4);
      border: 1px solid rgba(245,196,0,0.2);
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .brand-name span {
      color: var(--gold);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text2);
      margin-top: 4px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── Operadoras (decoração) ── */
    .op-badges {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 32px;
    }

    .op-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.04em;
    }

    .op-badge.t { background: rgba(0,122,61,0.2);  color: #4ade80; border: 1px solid rgba(0,122,61,0.3); }
    .op-badge.v { background: rgba(226,0,26,0.15); color: #f87171; border: 1px solid rgba(226,0,26,0.25); }
    .op-badge.m { background: rgba(244,121,32,0.15); color: #fb923c; border: 1px solid rgba(244,121,32,0.25); }

    /* ── Campos ── */
    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text2);
      margin-bottom: 7px;
    }

    .field-wrap {
      position: relative;
    }

    .field-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      pointer-events: none;
      opacity: 0.5;
    }

    .field input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .field input::placeholder { color: rgba(255,255,255,0.2); }

    .field input:focus {
      border-color: var(--green);
      background: rgba(0,122,61,0.08);
      box-shadow: 0 0 0 3px rgba(0,122,61,0.15);
    }

    /* mostrar/ocultar password */
    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      opacity: 0.4;
      transition: opacity 0.15s;
      padding: 4px;
    }
    .toggle-pw:hover { opacity: 0.8; }

    /* ── Erro ── */
    .error-msg {
      display: none;
      background: rgba(185,28,28,0.15);
      border: 1px solid rgba(185,28,28,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #fca5a5;
      margin-bottom: 16px;
      text-align: center;
    }

    /* ── Botão de entrar ── */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--green), var(--green2));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,122,61,0.35);
      margin-top: 6px;
    }

    .btn-login::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(0,122,61,0.45);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    /* ── Rodapé ── */
    .login-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 10px;
      color: rgba(255,255,255,0.15);
      line-height: 1.8;
    }

    /* ── Ecrã de carregamento após login ── */
    .loader-screen {
      position: fixed;
      inset: 0;
      background: var(--dark);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .loader-screen.show { display: flex; }

    .loader-logo {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      animation: pulse 1.2s ease infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .loader-bar-wrap {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--green), var(--gold));
      border-radius: 2px;
      transition: width 0.8s ease;
    }

    .loader-msg {
      font-size: 11px;
      color: var(--text2);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

  <div class="top-stripe"></div>
  <div class="bg-mesh"></div>
  <div class="bg-grid"></div>

  <!-- Ecrã de carregamento após login -->
  <div class="loader-screen" id="loader">
    <div class="loader-logo">📱 YouPhone S.A</div>
    <div class="loader-bar-wrap">
      <div class="loader-bar" id="loader-bar"></div>
    </div>
    <div class="loader-msg" id="loader-msg">A verificar credenciais...</div>
  </div>

  <!-- Card de login -->
  <div class="login-wrap">
    <div class="login-card">

      <div class="brand">
        <div class="brand-icon">📱</div>
        <div class="brand-name">YouPhone <span>S.A</span></div>
        <div class="brand-sub">Sistema de Requisições · Beira, Sofala</div>
      </div>

      <div class="op-badges">
        <span class="op-badge t">Tmcel</span>
        <span class="op-badge v">Vodacom</span>
        <span class="op-badge m">Movitel</span>
      </div>

      <div class="error-msg" id="error-msg">
        ⚠️ Utilizador ou palavra-passe incorrectos.
      </div>

      <div class="field">
        <label>Utilizador</label>
        <div class="field-wrap">
          <span class="field-icon">👤</span>
          <input type="text" id="inp-user" placeholder="O teu utilizador"
                 autocomplete="username" autofocus
                 onkeydown="if(event.key==='Enter') tryLogin()">
        </div>
      </div>

      <div class="field">
        <label>Palavra-passe</label>
        <div class="field-wrap">
          <span class="field-icon">🔒</span>
          <input type="password" id="inp-pass" placeholder="••••••••"
                 autocomplete="current-password"
                 onkeydown="if(event.key==='Enter') tryLogin()">
          <button class="toggle-pw" type="button" onclick="togglePw()" id="pw-eye" title="Mostrar/ocultar">👁️</button>
        </div>
      </div>

      <button class="btn-login" id="btn-login" onclick="tryLogin()">
        Entrar no Sistema
      </button>

      <div class="login-footer">
        YouPhone S.A · Beira, Sofala, Moçambique<br>
        Acesso restrito a pessoal autorizado
      </div>
    </div>
  </div>

<script>
  // ============================================================
  // CREDENCIAIS — altera aqui o utilizador e palavra-passe
  // Numa versão futura isto virá de um servidor seguro.
  // ============================================================
  const USERS = [
    { user: "admin",    pass: "youphone2025", nome: "Administrador" },
    { user: "operador", pass: "beira2025",    nome: "Operador"      },
  ];

  // Mostra/oculta a password
  function togglePw() {
    const inp = document.getElementById('inp-pass');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  // Tenta fazer login
  function tryLogin() {
    const user = document.getElementById('inp-user').value.trim().toLowerCase();
    const pass = document.getElementById('inp-pass').value;
    const err  = document.getElementById('error-msg');

    err.style.display = 'none';

    // Verifica as credenciais
    const found = USERS.find(u => u.user === user && u.pass === pass);

    if (!found) {
      // Credenciais erradas — mostra mensagem de erro
      err.style.display = 'block';
      document.getElementById('inp-pass').value = '';
      document.getElementById('inp-pass').focus();
      return;
    }

    // Credenciais correctas — guarda sessão e redirige
    sessionStorage.setItem('yp_loggedin', '1');
    sessionStorage.setItem('yp_user', found.nome);

    // Mostra ecrã de carregamento animado
    const loader = document.getElementById('loader');
    const bar    = document.getElementById('loader-bar');
    const msg    = document.getElementById('loader-msg');

    loader.classList.add('show');

    setTimeout(() => { bar.style.width = '40%'; msg.textContent = 'A carregar dados...'; },    100);
    setTimeout(() => { bar.style.width = '75%'; msg.textContent = 'A preparar o sistema...'; }, 600);
    setTimeout(() => { bar.style.width = '100%'; }, 1100);

    // Vai para o dashboard após a animação
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 1500);
  }

  // Se já estiver autenticado, vai directo ao dashboard
  if (sessionStorage.getItem('yp_loggedin') === '1') {
    window.location.href = 'dashboard.html';
  }
</script>
</body>
</html>
